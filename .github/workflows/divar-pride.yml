name: Divar Pride Monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: divar-pride-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: بررسی آگهی‌های جدید
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # برای سخت‌گیرتر یا بازتر کردن فیلترها فقط همین عددها را تغییر دهید
          PRICE_MIN: "330000000"
          PRICE_MAX: "520000000"
          MILEAGE_MIN: "80000"
          MILEAGE_MAX: "480000"
          YEAR_MIN: "1383"
        run: python divar_pride_monitor.py

      # حتی اگر مرحله قبل خطا بدهد، وضعیت ذخیره می‌شود تا آگهی‌های
      # فرستاده‌شده دوباره ارسال نشوند و فرستاده‌نشده‌ها در صف بمانند.
      - name: ذخیره فهرست آگهی‌های دیده‌شده
        if: always()
        run: |
          if [ -n "$(git status --porcelain seen.json)" ]; then
            git config user.name "divar-monitor"
            git config user.email "divar-monitor@users.noreply.github.com"
            git add seen.json
            git commit -m "chore: update seen divar ads"
            git pull --rebase --autostash || true
            git push
          else
            echo "تغییری در seen.json نبود"
          fi
